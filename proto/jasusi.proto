syntax = "proto3";
package jasusi.v3;

service JasusCoreService {
  rpc ExecuteTool      (ToolRequest)     returns (stream ToolEvent);
  rpc UpsertMemory     (MemoryEntry)     returns (UpsertResult);
  rpc QueryMemory      (MemoryQuery)     returns (MemoryResponse);
  rpc RollbackMemory   (RollbackRequest) returns (RollbackResult);
  rpc VerifyLedger     (Empty)           returns (LedgerStatus);
  rpc GetLedgerEntries (LedgerQuery)     returns (stream LedgerEntry);
  rpc GetSessionState  (SessionKey)      returns (SessionState);
  rpc UpdateSession    (SessionUpdate)   returns (Empty);
}

message ToolRequest {
  string tool_name        = 1;
  bytes  input_json       = 2;
  string session_id       = 3;
  string project          = 4;
  PermissionMode permission        = 5;
  SandboxProfile sandbox_profile   = 6;
}
message ToolEvent {
  oneof event {
    ToolOutput        output   = 1;
    SecurityException security = 2;
    PermissionPrompt  prompt   = 3;
    ToolError         error    = 4;
    ProgressUpdate    progress = 5;
  }
}
message ToolOutput        { string content = 1; bool is_error = 2; }
message ToolError         { string message = 1; string tool_name = 2; }
message ProgressUpdate    { string message = 1; uint32 percent_complete = 2; }
message SecurityException {
  string file_path         = 1;
  string threat_class      = 2;
  string detected_fragment = 3;
  string quarantine_path   = 4;
}
message PermissionPrompt  { string tool_name = 1; string description = 2; string preview = 3; }
message MemoryEntry {
  string collection      = 1;
  bytes  vector          = 2;
  string content         = 3;
  string session_id      = 4;
  string origin          = 5;
  uint32 trust_level     = 6;
  string provenance_hash = 7;
  uint64 audit_seq       = 8;
}
message MemoryQuery    { string collection = 1; bytes query_vector = 2; uint32 limit = 3; uint32 min_trust = 4; }
message MemoryResponse { repeated MemoryResult results = 1; }
message MemoryResult   { string content = 1; float score = 2; uint32 trust_level = 3; }
message RollbackRequest { string project = 1; string cutoff_timestamp = 2; }
message RollbackResult  { uint32 removed_count = 1; uint64 ledger_seq = 2; }
// `tampered` carries presence explicitly rather than relying on a proto3
// `optional` label: explicit field presence requires protoc >= 3.15, and the
// build must not depend on which protoc happens to be on the host PATH.
// Sequence 0 is a valid ledger position, so absence cannot be encoded as 0.
message LedgerStatus    { bool verified = 1; bool tampered = 2; uint64 tampered_at_seq = 3; }
message LedgerQuery     { string session_id = 1; uint32 limit = 2; }
message LedgerEntry     {
  uint64 seq = 1; string timestamp = 2; string event_type = 3;
  string actor = 4; string outcome = 5; string detail = 6;
}
message SessionKey    { string session_id = 1; string project = 2; }
message SessionState  {
  string session_id = 1; uint64 input_tokens = 2; uint64 output_tokens = 3;
  uint32 compaction_count = 4; string updated_at = 5;
}
message SessionUpdate { string session_id = 1; string project = 2;
                        uint64 input_tokens = 3; uint64 output_tokens = 4; }
message Empty        {}
message UpsertResult { bool success = 1; }

enum PermissionMode  { ALLOW = 0; DENY = 1; PROMPT = 2; }
enum SandboxProfile  { STRICT = 0; FILE = 1; SEARCH = 2; WEB = 3; NONE = 4; }
enum DeploymentProfile { LOCAL = 0; SERVICE = 1; }

service ControlService {
  rpc GetVersion     (Empty)             returns (VersionInfo);
  rpc Health         (Empty)             returns (HealthStatus);
  rpc Readiness      (Empty)             returns (ReadinessStatus);
  rpc GetMetrics     (Empty)             returns (MetricsSnapshot);
  rpc CheckQuota     (QuotaCheck)        returns (QuotaStatus);
  rpc SubmitJob      (JobSubmit)         returns (JobReference);
  rpc GetJobStatus   (JobReference)      returns (JobStatus);
  rpc CancelJob      (JobReference)      returns (JobStatus);
  rpc StreamJobEvents(JobReference)      returns (stream JobEvent);
  rpc Drain          (DrainRequest)      returns (DrainStatus);
}

message VersionInfo      { string version = 1; string profile = 2; string git_sha = 3; }
message HealthStatus     { bool healthy = 1; string version = 2; DeploymentProfile profile = 3; }
message ComponentStatus  { string name = 1; bool ready = 2; string reason = 3; }
message ReadinessStatus  { bool ready = 1; repeated ComponentStatus components = 2; }
message MetricPoint      { string name = 1; uint64 value = 2; string unit = 3; uint64 timestamp_ms = 4; map<string,string> labels = 5; }
message MetricsSnapshot  { repeated MetricPoint metrics = 1; }
message QuotaCheck       { string scope = 1; string user_id = 2; string project_id = 3; string provider = 4; string tool = 5; uint64 requested = 6; }
message QuotaStatus      { bool allowed = 1; uint64 remaining = 2; uint64 limit = 3; string scope = 4; string reason = 5; }
message JobSubmit        { string idempotency_key = 1; string project_id = 2; string user_id = 3; string prompt = 4; string requested_profile = 5; }
message JobReference     { string job_id = 1; }
message JobStatus        { string job_id = 1; string state = 2; uint64 created_at_ms = 3; uint64 started_at_ms = 4; uint64 completed_at_ms = 5; string terminal_message = 6; }
message JobEvent         { string job_id = 1; string event_type = 2; string payload_json = 3; uint64 emitted_at_ms = 4; }
message DrainRequest     { bool enable = 1; uint32 timeout_seconds = 2; }
message DrainStatus      { bool draining = 1; uint32 active_jobs = 2; bool complete = 3; }
